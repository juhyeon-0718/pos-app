openapi: 3.0.3
info:
  title: 식당 운영 웹앱 API (지인 매장 전용 MVP)
  version: 0.1.0
  description: |
    단일 매장 식당 운영 웹앱 API 계약.
    인증 방식 두 가지:
      - `bearerAuth` (JWT): staff / kitchen / owner 로그인 계정
      - `tableToken`: 손님이 테이블 QR을 찍어 발급받는 세션 토큰 (로그인 불필요, 4시간 만료, 결제완료 시 만료, 재발급 시 구토큰 즉시 무효)

    ## 권한 표
    | 리소스/액션 | 손님(tableToken) | 직원(staff) | 주방(kitchen) | 사장(owner) |
    |---|---|---|---|---|
    | 메뉴 조회 | O | O | O | O |
    | 주문 생성 | O (본인 테이블) | O | - | O |
    | 주문 전체 목록 조회 | - | O | O (조리 관련만) | O |
    | 본인 주문 조회 | O | - | - | - |
    | 주문 상태 변경(조리 전 취소) | - | O | - | O |
    | 주문 상태 변경(조리 후 취소) | - | - | - | O |
    | 주방 큐 처리(접수/완료) | - | - | O | O |
    | 결제완료 처리 | - | O | - | O |
    | 식재료/재고 조회 | - | O | - | O |
    | 레시피 등록/수정 | - | - | - | O |
    | 발주 추천 조회/승인/반려 | - | - | - | O |
    | 매출/사용량 분석 조회 | - | - | - | O |
    | 테이블 QR 발급/재발급 | - | - | - | O |
    | 사용자(직원/주방) 계정 관리 | - | - | - | O |
    | SSE 이벤트 구독 | - | O | O | O |

servers:
  - url: /api/v1

security: []

tags:
  - name: auth
  - name: tables
  - name: menus
  - name: orders
  - name: kitchen
  - name: ingredients
  - name: recipes
  - name: analytics
  - name: purchase-recommendations
  - name: users
  - name: stream

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: 직원/주방/사장 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: bearer }
                  role: { $ref: '#/components/schemas/Role' }
        '401':
          description: 인증 실패

  /tables/{table_id}/session:
    post:
      tags: [tables]
      summary: 테이블 QR 스캔 → 손님 세션 토큰 발급
      parameters:
        - $ref: '#/components/parameters/TableId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token]
              properties:
                qr_token: { type: string, description: QR에 인코딩된 현재 유효 토큰 값 }
      responses:
        '200':
          description: 세션 토큰 발급 (만료 4시간, 재발급 시 구토큰 무효)
          content:
            application/json:
              schema:
                type: object
                properties:
                  table_session_token: { type: string }
                  expires_at: { type: string, format: date-time }
        '401':
          description: QR 토큰 무효/만료

  /tables:
    get:
      tags: [tables]
      summary: 테이블 목록 조회 (사장)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 테이블 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Table' }

  /tables/{table_id}/qr/reissue:
    post:
      tags: [tables]
      summary: 테이블 QR 재발급 (사장). 기존 세션 토큰은 즉시 무효화됨
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TableId'
      responses:
        '200':
          description: 재발급된 QR 토큰
          content:
            application/json:
              schema:
                type: object
                properties:
                  qr_token: { type: string }

  /menus:
    get:
      tags: [menus]
      summary: 메뉴 목록 조회 (손님/직원/주방/사장 공통)
      security: [{ tableToken: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: 메뉴 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Menu' }

  /menus/{menu_id}/recipe:
    get:
      tags: [recipes]
      summary: 메뉴 레시피(식재료 BOM) 조회
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MenuId'
      responses:
        '200':
          description: 레시피 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecipeItem' }
    put:
      tags: [recipes]
      summary: 메뉴 레시피 등록/수정 (사장 전용)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MenuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/RecipeItem' }
      responses:
        '200':
          description: 저장됨
        '403':
          description: 사장 권한 아님

  /orders:
    post:
      tags: [orders]
      summary: 주문 생성 (손님 또는 직원 대리 입력)
      security: [{ tableToken: [] }, { bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            클라이언트(QR 화면/직원 화면)가 생성한 UUID. 같은 키로 재요청하면 기존 주문을 그대로 반환한다(중복 생성 방지).
            같은 키에 본문이 다르면 422를 반환한다. 서버는 키를 24시간 보관한다.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [menu_id, qty]
                    properties:
                      menu_id: { type: string }
                      qty: { type: integer, minimum: 1 }
      responses:
        '201':
          description: |
            주문 생성됨 (접수 상태로 시작, 레시피 기준 식재료 즉시 차감).
            식재료가 부족해도 주문 생성은 막지 않는다 — 부족한 식재료가 있으면 `stock_warnings[]`에 내려주고
            직원/사장에게 SSE `stock.warning` 이벤트를 보낸다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '422':
          description: 같은 Idempotency-Key로 본문이 다른 요청이 재전송됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                code: IDEMPOTENCY_KEY_MISMATCH
                detail: 같은 Idempotency-Key로 이전과 다른 요청 본문이 전송되었습니다.
    get:
      tags: [orders]
      summary: 전체 주문 목록 조회 (직원/주방/사장)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          description: 주문 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }

  /orders/mine:
    get:
      tags: [orders]
      summary: 내 테이블 주문 상태 조회 (손님)
      security: [{ tableToken: [] }]
      responses:
        '200':
          description: 현재 테이블 세션의 주문 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }

  /orders/{order_id}:
    get:
      tags: [orders]
      summary: 주문 상세 조회
      security: [{ bearerAuth: [] }, { tableToken: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 주문 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }

  /orders/{order_id}/status:
    patch:
      tags: [orders]
      summary: |
        주문 상태 변경. 허용 전이: received→cooking→served→paid, 임의 단계에서 cancelled 가능.
        주문 상태는 서비스 레이어가 항목 상태(pending/cooking/done) 변경과 같은 트랜잭션에서 자동 계산한다(항목 하나라도 cooking이면 주문도 cooking).
        served/paid는 직원이 주문 단위로 수동 변경한다.
        - 조리 시작 전 취소: 직원/사장, `stock_movements`에 `cancel_restore`(+수량) 기록
        - 조리 시작 후 취소: 사장 전용, `stock_movements`에 `cancel_restore`(+수량)와 `disposal`(-수량)을 한 쌍으로 같은 트랜잭션에 기록 (순 재고 변화 0, D-19)
        - 결제완료 처리: 직원/사장
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          description: 상태 변경됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          description: 허용되지 않는 상태 전이
        '403':
          description: 역할상 불가함 (조리 후 취소는 사장 전용 등)

  /kitchen/queue:
    get:
      tags: [kitchen]
      summary: 조리 대기/진행 목록 조회 (주방)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 주문 항목 단위 큐
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderItem' }

  /kitchen/items/{item_id}/status:
    patch:
      tags: [kitchen]
      summary: 주문 항목 접수/완료 처리 (주방)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: item_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, cooking, done] }
      responses:
        '200':
          description: 변경됨

  /ingredients:
    get:
      tags: [ingredients]
      summary: 식재료 재고 현황 조회 (직원/사장)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 식재료 목록(현재재고 포함)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Ingredient' }

  /ingredients/{ingredient_id}/movements:
    get:
      tags: [ingredients]
      summary: 식재료 입출고 원장(stock_movements) 조회 (사장)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: ingredient_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 원장 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StockMovement' }

  /analytics/sales:
    get:
      tags: [analytics]
      summary: 매출 추이 집계 (사장, 대시보드 차트용 — 백엔드 집계 결과만 반환)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [day, week, month], default: day }
      responses:
        '200':
          description: |
            집계 응답 예시:
            {"period":"day","points":[{"label":"2026-10-10","revenue":452000,"order_count":31}]}
          content:
            application/json:
              schema:
                type: object
                properties:
                  period: { type: string }
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        revenue: { type: number }
                        order_count: { type: integer }

  /analytics/ingredient-usage:
    get:
      tags: [analytics]
      summary: 식재료 사용량 추이 집계 (사장)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [day, week, month], default: day }
      responses:
        '200':
          description: 식재료별 집계된 사용량 시계열
          content:
            application/json:
              schema:
                type: object
                properties:
                  period: { type: string }
                  ingredients:
                    type: array
                    items:
                      type: object
                      properties:
                        ingredient_id: { type: string }
                        name: { type: string }
                        points:
                          type: array
                          items:
                            type: object
                            properties:
                              label: { type: string }
                              used_qty: { type: number }

  /purchase-recommendations:
    get:
      tags: [purchase-recommendations]
      summary: 발주 추천 목록 조회 (사장)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [제안, 승인, 반려] }
      responses:
        '200':
          description: 발주 추천 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PurchaseRecommendation' }

  /purchase-recommendations/{rec_id}/approve:
    post:
      tags: [purchase-recommendations]
      summary: 발주 추천 승인 (사장)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RecId'
      responses:
        '200':
          description: 승인됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseRecommendation' }

  /purchase-recommendations/{rec_id}/reject:
    post:
      tags: [purchase-recommendations]
      summary: 발주 추천 반려 (사장). 반려 시 해당 식재료는 쿨다운 시간(기본 24h, 설정 가능) 동안 재추천되지 않음
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RecId'
      responses:
        '200':
          description: 반려됨

  /users:
    get:
      tags: [users]
      summary: 직원/주방 계정 목록 조회 (사장)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 사용자 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
    post:
      tags: [users]
      summary: 직원/주방 계정 생성 (사장)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: { type: string }
                password: { type: string }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /health:
    get:
      summary: 헬스체크
      security: []
      responses:
        '200':
          description: OK

  /stream/orders:
    get:
      tags: [stream]
      summary: |
        SSE 구독 (직원/주방/사장). text/event-stream 응답.
        이벤트 타입(event 필드): order.created, order.status_changed,
        order_item.status_changed, order.cancelled, purchase_recommendation.created,
        stock.warning (주문 생성 시 식재료 부족 발생).

        예시 프레임:
        event: order.status_changed
        data: {"order_id":"o_123","status":"cooking","table_id":"t_5"}

        event: stock.warning
        data: {"order_id":"o_123","ingredient_id":"i_7","name":"양파","current_stock":0.5,"required":2}

        클라이언트는 재연결 시 최신 상태를 REST로 다시 조회해 동기화한다(이벤트 유실 대비, at-least-once 미보장).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 이벤트 스트림
          content:
            text/event-stream:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tableToken:
      type: apiKey
      in: header
      name: X-Table-Session-Token

  parameters:
    TableId:
      name: table_id
      in: path
      required: true
      schema: { type: string }
    MenuId:
      name: menu_id
      in: path
      required: true
      schema: { type: string }
    OrderId:
      name: order_id
      in: path
      required: true
      schema: { type: string }
    RecId:
      name: rec_id
      in: path
      required: true
      schema: { type: string }

  schemas:
    Role:
      type: string
      enum: [staff, kitchen, owner]

    OrderStatus:
      type: string
      enum: [received, cooking, served, paid, cancelled]

    Table:
      type: object
      properties:
        id: { type: string }
        table_no: { type: integer }
        qr_token: { type: string }
        qr_issued_at: { type: string, format: date-time }

    Menu:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: number }
        category: { type: string }
        is_active: { type: boolean }

    RecipeItem:
      type: object
      properties:
        ingredient_id: { type: string }
        qty_per_unit: { type: number }
        unit: { type: string }

    OrderItem:
      type: object
      properties:
        id: { type: string }
        order_id: { type: string }
        menu_id: { type: string }
        menu_name: { type: string }
        qty: { type: integer }
        price_snapshot: { type: number }
        item_status: { type: string, enum: [pending, cooking, done] }

    Order:
      type: object
      properties:
        id: { type: string }
        table_id: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        total_amount: { type: number }
        created_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        stock_warnings:
          type: array
          description: 레시피 기준 식재료가 부족한 항목 목록 (D-14, 주문 생성을 막지 않음)
          items:
            type: object
            properties:
              ingredient_id: { type: string }
              name: { type: string }
              current_stock: { type: number }
              required: { type: number }

    Ingredient:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        unit: { type: string }
        current_stock: { type: number }
        safety_stock: { type: number }
        lead_time_days: { type: integer }

    StockMovement:
      type: object
      properties:
        id: { type: string }
        ingredient_id: { type: string }
        qty_delta: { type: number }
        type: { type: string, enum: [order_deduction, cancel_restore, disposal, restock, adjustment, purchase_restock] }
        ref_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    PurchaseRecommendation:
      type: object
      properties:
        id: { type: string }
        ingredient_id: { type: string }
        recommended_qty: { type: number }
        basis:
          type: object
          description: 예측 근거(이동평균, 요일별 패턴 등 통계 값)
        llm_explanation:
          type: string
          nullable: true
          description: Claude API로 생성된 설명. API 키 미설정 시 null
        status: { type: string, enum: [제안, 승인, 반려] }
        created_at: { type: string, format: date-time }
        approved_by: { type: string, nullable: true }

    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    ErrorResponse:
      type: object
      required: [code, detail]
      properties:
        code: { type: string, example: IDEMPOTENCY_KEY_MISMATCH }
        detail: { type: string }
