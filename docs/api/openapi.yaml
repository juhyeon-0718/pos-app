openapi: 3.0.3
info:
  title: 식당 운영 웹앱 API (지인 매장 전용 MVP)
  version: 0.2.0
  description: |
    단일 매장 식당 운영 웹앱 API 계약.
    인증 방식 세 가지:
      - `bearerAuth` (JWT): staff / kitchen / owner 로그인 계정
      - `tableToken`: 손님이 테이블 QR을 찍어 발급받는 세션 토큰 (로그인 불필요, 4시간 만료, 결제완료 시 만료, 재발급 시 구토큰 즉시 무효)
      - `streamToken`: `/stream/orders` 전용 단기 토큰. EventSource가 커스텀 헤더를 보낼 수 없어
        `bearerAuth` 로그인 후 `POST /stream/token`으로 교환해 쿼리 파라미터(`?token=`)로 전달한다.

    ## 권한 표
    | 리소스/액션 | 손님(tableToken) | 직원(staff) | 주방(kitchen) | 사장(owner) |
    |---|---|---|---|---|
    | 메뉴 조회 | O | O | O | O |
    | 메뉴/식재료 CRUD | - | - | - | O |
    | 주문 생성 | O (본인 테이블) | O (table_id 필수) | - | O |
    | 주문 전체 목록 조회 | - | O | O (조리 관련만) | O |
    | 본인 주문 조회 | O | - | - | - |
    | 주문 상태 변경(조리 전 취소) | - | O | - | O |
    | 주문 상태 변경(조리 후 취소) | - | - | - | O |
    | 주방 큐 처리(접수/완료) | - | - | O | O |
    | 결제완료 처리 | - | O | - | O |
    | 식재료/재고 조회·입출고 등록 | - | - | - | O |
    | 레시피 등록/수정 | - | - | - | O |
    | 발주 추천 조회/승인/반려, 쿨다운 설정 | - | - | - | O |
    | 매출/사용량 분석 조회 | - | - | - | O |
    | 테이블 생성/QR 발급·재발급 | - | - | - | O |
    | 사용자(직원/주방) 계정 관리 | - | - | - | O |
    | SSE 이벤트 구독 | - | O | O | O |

servers:
  - url: /api/v1

security: []

tags:
  - name: auth
  - name: tables
  - name: menus
  - name: recipes
  - name: orders
  - name: kitchen
  - name: ingredients
  - name: analytics
  - name: purchase-recommendations
  - name: users
  - name: stream

paths:
  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: 직원/주방/사장 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: bearer }
                  role: { $ref: '#/components/schemas/Role' }
        '401':
          description: 인증 실패 (아이디/비밀번호 불일치)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /stream/token:
    post:
      operationId: issueStreamToken
      tags: [stream]
      summary: SSE 구독용 단기 토큰 발급 (직원/주방/사장). 로그인된 bearerAuth를 짧은 쿼리 토큰으로 교환한다.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 단기 토큰 발급 (만료 5분)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tables/{table_id}/session:
    post:
      operationId: createTableSession
      tags: [tables]
      summary: 테이블 QR 스캔 → 손님 세션 토큰 발급
      parameters:
        - $ref: '#/components/parameters/TableId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token]
              properties:
                qr_token: { type: string, description: QR에 인코딩된 현재 유효 토큰 값 }
      responses:
        '200':
          description: 세션 토큰 발급 (만료 4시간, 재발급 시 구토큰 무효)
          content:
            application/json:
              schema:
                type: object
                properties:
                  table_session_token: { type: string }
                  expires_at: { type: string, format: date-time }
        '401':
          description: QR 토큰 무효/만료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tables:
    get:
      operationId: listTables
      tags: [tables]
      summary: 테이블 목록 조회 (사장)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 테이블 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TableListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createTable
      tags: [tables]
      summary: 테이블 생성 (사장)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [table_no]
              properties:
                table_no: { type: integer }
      responses:
        '201':
          description: 생성됨 (QR 토큰 자동 발급)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Table' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tables/{table_id}/qr/reissue:
    post:
      operationId: reissueTableQr
      tags: [tables]
      summary: 테이블 QR 재발급 (사장). 기존 세션 토큰은 즉시 무효화됨
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TableId'
      responses:
        '200':
          description: 재발급된 QR 토큰
          content:
            application/json:
              schema:
                type: object
                properties:
                  qr_token: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /menus:
    get:
      operationId: listMenus
      tags: [menus]
      summary: 메뉴 목록 조회 (손님/직원/주방/사장 공통)
      security: [{ tableToken: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 메뉴 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createMenu
      tags: [menus]
      summary: 메뉴 생성 (사장)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuWrite' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menu' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /menus/{menu_id}:
    patch:
      operationId: updateMenu
      tags: [menus]
      summary: 메뉴 수정 (사장)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MenuId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuWrite' }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menu' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      operationId: deleteMenu
      tags: [menus]
      summary: 메뉴 삭제 (사장). 실제로는 is_active=false로 비활성화한다.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MenuId'
      responses:
        '204':
          description: 비활성화됨
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /menus/{menu_id}/recipe:
    get:
      operationId: getMenuRecipe
      tags: [recipes]
      summary: 메뉴 레시피(식재료 BOM) 조회
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MenuId'
      responses:
        '200':
          description: 레시피 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecipeItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: updateMenuRecipe
      tags: [recipes]
      summary: 메뉴 레시피 등록/수정 (사장 전용)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MenuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/RecipeItem' }
      responses:
        '200':
          description: 저장됨
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 사장 권한 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: 주문 생성 (손님 또는 직원 대리 입력)
      security: [{ tableToken: [] }, { bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            클라이언트(QR 화면/직원 화면)가 생성한 UUID. 같은 키로 재요청하면 기존 주문을 그대로 반환한다(중복 생성 방지).
            같은 키에 본문이 다르면 422를 반환한다. 서버는 키를 24시간 보관한다.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CustomerOrderRequest'
                - $ref: '#/components/schemas/StaffOrderRequest'
            examples:
              customer:
                summary: 손님 주문 (tableToken, table_id 불필요 — 세션에서 식별)
                value: { items: [{ menu_id: "m_1", qty: 2 }] }
              staff:
                summary: 직원 대리 주문 (bearerAuth, table_id 필수)
                value: { table_id: "t_5", items: [{ menu_id: "m_1", qty: 2 }] }
      responses:
        '201':
          description: |
            주문 생성됨 (접수 상태로 시작, 레시피 기준 식재료 즉시 차감).
            식재료가 부족해도 주문 생성은 막지 않는다 — 부족한 식재료가 있으면 `stock_warnings[]`에 내려주고
            직원/사장에게 SSE `stock.warning` 이벤트를 보낸다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: 같은 Idempotency-Key로 본문이 다른 요청이 재전송됨, 또는 직원 대리 주문에 table_id가 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: IDEMPOTENCY_KEY_MISMATCH
                detail: 같은 Idempotency-Key로 이전과 다른 요청 본문이 전송되었습니다.
    get:
      operationId: listOrders
      tags: [orders]
      summary: 전체 주문 목록 조회 (직원/주방/사장)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 주문 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /orders/mine:
    get:
      operationId: listMyOrders
      tags: [orders]
      summary: 내 테이블 주문 상태 조회 (손님)
      security: [{ tableToken: [] }]
      responses:
        '200':
          description: 현재 테이블 세션의 주문 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /orders/{order_id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: 주문 상세 조회
      security: [{ bearerAuth: [] }, { tableToken: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 주문 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /orders/{order_id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: |
        주문 상태 변경. 허용 전이: received→cooking→served→paid, 임의 단계에서 cancelled 가능.
        주문 상태는 서비스 레이어가 항목 상태(pending/cooking/done) 변경과 같은 트랜잭션에서 자동 계산한다(항목 하나라도 cooking이면 주문도 cooking).
        served/paid는 직원이 주문 단위로 수동 변경한다.
        - 조리 시작 전 취소: 직원/사장, `stock_movements`에 `cancel_restore`(+수량) 기록
        - 조리 시작 후 취소: 사장 전용, `stock_movements`에 `cancel_restore`(+수량)와 `disposal`(-수량)을 한 쌍으로 같은 트랜잭션에 기록 (순 재고 변화 0, D-19)
        - 결제완료 처리: 직원/사장
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          description: 상태 변경됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 역할상 불가함 (조리 후 취소는 사장 전용 등)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 허용되지 않는 상태 전이
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /kitchen/queue:
    get:
      operationId: listKitchenQueue
      tags: [kitchen]
      summary: 조리 대기/진행 목록 조회 (주방)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 주문 항목 단위 큐
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /kitchen/items/{item_id}/status:
    patch:
      operationId: updateKitchenItemStatus
      tags: [kitchen]
      summary: 주문 항목 접수/완료 처리 (주방)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: item_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, cooking, done] }
      responses:
        '200':
          description: 변경됨
        '401': { $ref: '#/components/responses/Unauthorized' }

  /ingredients:
    get:
      operationId: listIngredients
      tags: [ingredients]
      summary: 식재료 재고 현황 조회 (사장)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 식재료 목록(현재재고 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngredientListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createIngredient
      tags: [ingredients]
      summary: 식재료 등록 (사장)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngredientWrite' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ingredient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /ingredients/{ingredient_id}:
    patch:
      operationId: updateIngredient
      tags: [ingredients]
      summary: 식재료 정보 수정 (사장). 재고량 자체는 movements로만 바꾼다.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: ingredient_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngredientWrite' }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ingredient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      operationId: deleteIngredient
      tags: [ingredients]
      summary: 식재료 삭제 (사장). 레시피에서 참조 중이면 409.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: ingredient_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: 삭제됨
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 레시피에서 참조 중이라 삭제 불가
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /ingredients/{ingredient_id}/movements:
    get:
      operationId: listIngredientMovements
      tags: [ingredients]
      summary: 식재료 입출고 원장(stock_movements) 조회 (사장)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: ingredient_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 원장 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockMovementListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createIngredientMovement
      tags: [ingredients]
      summary: 식재료 입출고 수동 등록 (사장). 입고(restock), 조정(adjustment) 등에 사용.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: ingredient_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qty_delta, type]
              properties:
                qty_delta: { type: number }
                type: { type: string, enum: [restock, adjustment, disposal, purchase_restock] }
                ref_id: { type: string, nullable: true }
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockMovement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /analytics/sales:
    get:
      operationId: getSalesTrend
      tags: [analytics]
      summary: 매출 추이 집계 (사장, 대시보드 차트용 — 백엔드 집계 결과만 반환)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [day, week, month], default: day }
      responses:
        '200':
          description: |
            집계 응답 예시:
            {"period":"day","points":[{"label":"2026-10-10","revenue":452000,"order_count":31}]}
          content:
            application/json:
              schema:
                type: object
                properties:
                  period: { type: string }
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        revenue: { type: number }
                        order_count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /analytics/sales/summary:
    get:
      operationId: getSalesSummary
      tags: [analytics]
      summary: 매출 요약 (사장, 기간 합계 — 대시보드 상단 카드용)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: 기간 매출 요약
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  revenue_total: { type: number }
                  order_count: { type: integer }
                  avg_order_value: { type: number }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /analytics/ingredient-usage:
    get:
      operationId: getIngredientUsageTrend
      tags: [analytics]
      summary: 식재료 사용량 추이 집계 (사장)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [day, week, month], default: day }
      responses:
        '200':
          description: 식재료별 집계된 사용량 시계열
          content:
            application/json:
              schema:
                type: object
                properties:
                  period: { type: string }
                  ingredients:
                    type: array
                    items:
                      type: object
                      properties:
                        ingredient_id: { type: string }
                        name: { type: string }
                        points:
                          type: array
                          items:
                            type: object
                            properties:
                              label: { type: string }
                              used_qty: { type: number }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /purchase-recommendations:
    get:
      operationId: listPurchaseRecommendations
      tags: [purchase-recommendations]
      summary: 발주 추천 목록 조회 (사장)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [제안, 승인, 반려] }
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 발주 추천 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseRecommendationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /purchase-recommendations/cooldown-settings:
    get:
      operationId: getPurchaseRecommendationCooldown
      tags: [purchase-recommendations]
      summary: 발주 추천 반려 쿨다운 설정 조회 (사장, 기본 24시간, D-09)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 현재 쿨다운 설정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CooldownSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: updatePurchaseRecommendationCooldown
      tags: [purchase-recommendations]
      summary: 발주 추천 반려 쿨다운 설정 변경 (사장)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CooldownSettings' }
      responses:
        '200':
          description: 변경됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CooldownSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /purchase-recommendations/{rec_id}/approve:
    post:
      operationId: approvePurchaseRecommendation
      tags: [purchase-recommendations]
      summary: 발주 추천 승인 (사장)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RecId'
      responses:
        '200':
          description: 승인됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseRecommendation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /purchase-recommendations/{rec_id}/reject:
    post:
      operationId: rejectPurchaseRecommendation
      tags: [purchase-recommendations]
      summary: 발주 추천 반려 (사장). 반려 시 해당 식재료는 쿨다운 시간(기본 24h, 설정 가능) 동안 재추천되지 않음
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RecId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, description: "반려 이유(자유 입력, 화면에 평문으로만 표시, D-24)" }
      responses:
        '200':
          description: 반려됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseRecommendation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: 직원/주방 계정 목록 조회 (사장)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 사용자 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createUser
      tags: [users]
      summary: 직원/주방 계정 생성 (사장)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: { type: string }
                password: { type: string }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{user_id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: 직원/주방 계정 수정 (사장). 비밀번호 재설정, 역할 변경, 비활성화에 사용.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string }
                role: { $ref: '#/components/schemas/Role' }
                is_active: { type: boolean }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /health:
    get:
      operationId: healthCheck
      summary: 헬스체크
      security: []
      responses:
        '200':
          description: OK

  /stream/orders:
    get:
      operationId: streamOrders
      tags: [stream]
      summary: |
        SSE 구독 (직원/주방/사장). text/event-stream 응답.
        EventSource는 커스텀 헤더를 보낼 수 없으므로 `POST /stream/token`으로 발급받은 단기 토큰을
        `?token=`으로 전달한다(만료 5분, 1회성이 아니라 만료 전까지 재연결에 재사용 가능).
        이벤트 타입(event 필드): order.created, order.status_changed,
        order_item.status_changed, order.cancelled, purchase_recommendation.created,
        stock.warning (주문 생성 시 식재료 부족 발생).

        예시 프레임:
        event: order.status_changed
        data: {"order_id":"o_123","status":"cooking","table_id":"t_5"}

        event: stock.warning
        data: {"order_id":"o_123","ingredient_id":"i_7","name":"양파","current_stock":0.5,"required":2}

        클라이언트는 재연결 시 최신 상태를 REST로 다시 조회해 동기화한다(이벤트 유실 대비, at-least-once 미보장).
      security: [{ streamToken: [] }]
      parameters:
        - name: token
          in: query
          required: true
          description: POST /stream/token으로 발급받은 단기 토큰
          schema: { type: string }
      responses:
        '200':
          description: 이벤트 스트림
          content:
            text/event-stream:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tableToken:
      type: apiKey
      in: header
      name: X-Table-Session-Token
    streamToken:
      type: apiKey
      in: query
      name: token

  parameters:
    TableId:
      name: table_id
      in: path
      required: true
      schema: { type: string }
    MenuId:
      name: menu_id
      in: path
      required: true
      schema: { type: string }
    OrderId:
      name: order_id
      in: path
      required: true
      schema: { type: string }
    RecId:
      name: rec_id
      in: path
      required: true
      schema: { type: string }
    FromDate:
      name: from
      in: query
      description: 조회 시작 시각(포함, ISO 8601)
      schema: { type: string, format: date-time }
    ToDate:
      name: to
      in: query
      description: 조회 종료 시각(미포함, ISO 8601)
      schema: { type: string, format: date-time }
    Limit:
      name: limit
      in: query
      description: 페이지당 항목 수
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: 이전 응답의 next_cursor 값. 첫 페이지는 생략한다.
      schema: { type: string, nullable: true }

  responses:
    Unauthorized:
      description: 인증 실패 또는 토큰 없음/만료
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 권한 없음 (역할상 접근 불가)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Role:
      type: string
      enum: [staff, kitchen, owner]

    OrderStatus:
      type: string
      enum: [received, cooking, served, paid, cancelled]

    Table:
      type: object
      properties:
        id: { type: string }
        table_no: { type: integer }
        qr_token: { type: string }
        qr_issued_at: { type: string, format: date-time }

    TableListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Table' }
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    Menu:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: number }
        category: { type: string }
        is_active: { type: boolean }

    MenuWrite:
      type: object
      required: [name, price]
      properties:
        name: { type: string }
        price: { type: number }
        category: { type: string }
        is_active: { type: boolean, default: true }

    MenuListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Menu' }
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    RecipeItem:
      type: object
      properties:
        ingredient_id: { type: string }
        qty_per_unit: { type: number }
        unit: { type: string }

    OrderItem:
      type: object
      properties:
        id: { type: string }
        order_id: { type: string }
        menu_id: { type: string }
        menu_name: { type: string }
        qty: { type: integer }
        price_snapshot: { type: number }
        item_status: { type: string, enum: [pending, cooking, done] }

    OrderItemInput:
      type: object
      required: [menu_id, qty]
      properties:
        menu_id: { type: string }
        qty: { type: integer, minimum: 1 }

    CustomerOrderRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItemInput' }

    StaffOrderRequest:
      type: object
      additionalProperties: false
      required: [table_id, items]
      properties:
        table_id:
          type: string
          description: 직원 대리 주문은 어느 테이블 주문인지 반드시 명시한다.
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItemInput' }

    Order:
      type: object
      properties:
        id: { type: string }
        table_id: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        total_amount: { type: number }
        created_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        stock_warnings:
          type: array
          description: 레시피 기준 식재료가 부족한 항목 목록 (D-14, 주문 생성을 막지 않음)
          items:
            type: object
            properties:
              ingredient_id: { type: string }
              name: { type: string }
              current_stock: { type: number }
              required: { type: number }

    OrderListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    Ingredient:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        unit: { type: string }
        current_stock: { type: number }
        safety_stock: { type: number }
        lead_time_days: { type: integer }
        unit_price: { type: number, description: 발주 추천 estimated_cost 계산에 쓰는 단가 }

    IngredientWrite:
      type: object
      required: [name, unit]
      properties:
        name: { type: string }
        unit: { type: string }
        safety_stock: { type: number }
        lead_time_days: { type: integer }
        unit_price: { type: number }

    IngredientListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Ingredient' }
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    StockMovement:
      type: object
      properties:
        id: { type: string }
        ingredient_id: { type: string }
        qty_delta: { type: number }
        type: { type: string, enum: [order_deduction, cancel_restore, disposal, restock, adjustment, purchase_restock] }
        ref_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    StockMovementListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StockMovement' }
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    PurchaseRecommendationBasis:
      type: object
      description: 예측 근거(통계 계산값, purchasing 모듈이 산출). LLM이 생성하지 않는다(D-08).
      properties:
        method: { type: string, description: "예: moving_average, weekday_pattern" }
        window_days: { type: integer }
        avg_daily_usage: { type: number }
        computed_at: { type: string, format: date-time }

    PurchaseRecommendation:
      type: object
      properties:
        id: { type: string }
        ingredient_id: { type: string }
        ingredient_name: { type: string }
        unit: { type: string }
        current_stock: { type: number }
        safety_stock: { type: number }
        avg_usage: { type: number, description: 최근 기간 일평균 사용량 }
        lead_time_days: { type: integer }
        recommended_qty: { type: number }
        estimated_cost: { type: number, description: recommended_qty * Ingredient.unit_price }
        basis: { $ref: '#/components/schemas/PurchaseRecommendationBasis' }
        llm_explanation:
          type: string
          nullable: true
          description: Claude API(explain 모듈)로 생성된 설명 문장. API 키 미설정/장애 시 null. 수량 계산에는 쓰이지 않는다(D-08).
        status: { type: string, enum: [제안, 승인, 반려] }
        reason:
          type: string
          nullable: true
          description: 반려 시 사장이 입력한 반려 이유
        created_at: { type: string, format: date-time }
        approved_by: { type: string, nullable: true }

    PurchaseRecommendationListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PurchaseRecommendation' }
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    CooldownSettings:
      type: object
      required: [cooldown_hours]
      properties:
        cooldown_hours:
          type: integer
          minimum: 1
          default: 24
          description: 반려 후 같은 식재료를 재추천하지 않는 시간(D-09)

    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        is_active: { type: boolean }

    UserListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    Error:
      type: object
      required: [code, detail]
      properties:
        code: { type: string, example: IDEMPOTENCY_KEY_MISMATCH }
        detail: { type: string }
