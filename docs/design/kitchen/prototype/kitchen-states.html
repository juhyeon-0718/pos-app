<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주방 상태별 시안 · U-04b (태블릿·휴대폰)</title>
<link rel="stylesheet" href="kitchen.css">
<style>
  .proto-bar { position: sticky; top: 0; z-index: 400; background: var(--color-bg-default); border-bottom: var(--border-thin) dashed var(--color-border-strong); padding: var(--spacing-sm) var(--spacing-md); display: flex; flex-wrap: wrap; gap: var(--gap-sm); align-items: center; }
  .proto-bar b { font-size: var(--font-size-sm); color: var(--color-text-secondary); width: 100%; }
  .proto-bar button { min-height: var(--size-touch-min); padding: 0 var(--spacing-md); font: inherit; font-size: var(--font-size-sm); background: var(--color-bg-default); border: var(--border-thin) solid var(--color-border-strong); border-radius: var(--radius-full); cursor: pointer; }
  .proto-bar button[aria-pressed="true"] { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-text-on-fill); }
</style>
</head>
<body>
<div class="proto-bar" id="bar"></div>
<header class="k-bar">
  <img class="app-logo" src="../../brand/logo-compact-black.png" alt="75MHz LIVE PUB">
  <h1 class="k-title">주방</h1>
  <span class="k-spacer"></span>
  <span id="conn"></span>
  <span class="k-clock">18:42</span>
</header>
<div class="k-tabs" id="tabs" role="tablist"></div>
<div id="banner"></div>
<main class="k-board" id="board" data-tab="recv"></main>
<script src="../../components/prototype/ui.js"></script>
<script>
/* 데이터 필드는 openapi Order / OrderItem 그대로: table_no, created_at, items[menu_name, qty, item_status]. 값은 모두 더미. 폭 기준은 768px 하나(DESIGN.md 반응형). */
const STATES = [
  ['default','기본'],['loading','로딩'],['empty','빈 상태'],['error','불러오기 오류'],
  ['offline','연결 끊김'],['busy','처리 중'],['partial','일부 항목 실패']
];
const ORDERS = {
  recv: [
    { table: 3, min: 14, items: [['오늘의 플레이트',1,'pending'],['버팔로 윙',2,'pending']] },
    { table: 7, min: 3, items: [['마른안주',1,'pending'],['치즈 플레이트',1,'pending'],['올리브마리네이트',1,'pending']] },
    { table: 12, min: 1, items: [['아주 긴 이름의 시즌 한정 메뉴 예시 (두 줄까지만 표시)',1,'pending']] }
  ],
  cook: [
    { table: 5, min: 8, items: [['참치마요 카나페',1,'done'],['오늘의 플레이트',2,'cooking']] },
    { table: 9, min: 6, items: [['버팔로 윙',3,'cooking']] }
  ]
};
const LATE_MIN = 10; /* 정주현 님 확정(10분). 구현은 상수 하나. */
let state = new URLSearchParams(location.search).get('state') || 'default';
let tab = new URLSearchParams(location.search).get('tab') || 'recv';
const ic = n => '<i data-icon="'+n+'"></i>';
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function itemRow(it, ctx) {
  const [name, qty, st] = it;
  let right;
  if (st === 'done') right = '<span class="k-done">'+ic('check')+'완료</span>';
  else if (ctx.busy && ctx.busy.includes(name)) right = '<button class="btn btn-secondary" disabled aria-busy="true">'+ic('spinner')+'처리 중</button>';
  else if (ctx.fail === name) right = '<button class="btn btn-danger" aria-label="'+esc(name)+' 처리 실패, 다시 시도">'+ic('alert')+'다시 시도</button>';
  else if (st === 'pending') right = '<button class="btn btn-primary">'+ic('flame')+'시작</button>';
  else right = '<button class="btn btn-success">'+ic('check')+'완료</button>';
  const wrap = st === 'done' ? '' : '<span class="k-row-act">'+right+'</span>';
  return '<li class="'+(st==='done'?'is-done':'')+'"><span class="k-name">'+esc(name)+'</span><span class="k-qty">×'+qty+'</span>'+(st==='done'?'<span class="k-row-act" style="justify-content:flex-start">'+right+'</span>':wrap)+'</li>';
}
function card(o, kind, ctx) {
  ctx = ctx || {};
  const late = o.min >= LATE_MIN;
  const pend = o.items.filter(i=>i[2]==='pending').length;
  const cook = o.items.filter(i=>i[2]==='cooking').length;
  let bulk = '';
  if (kind==='recv' && pend>=2) bulk = '<div class="k-act"><button class="btn btn-secondary"'+(ctx.busyAll?' disabled':'')+'>'+ic('flame')+'전부 시작</button></div>';
  if (kind==='cook' && cook>=2) bulk = '<div class="k-act"><button class="btn btn-secondary">'+ic('check')+'전부 완료</button></div>';
  return '<article class="k-card'+(late?' late':'')+'" aria-label="'+o.table+'번 테이블, '+o.min+'분 경과"><div class="k-side"><div class="k-table">'+o.table+'<small>번 테이블</small></div><div class="k-meta"><span class="k-elapsed">'+ic('clock')+o.min+'분</span>'+(late?'<span class="k-late">'+ic('alert')+'지연</span>':'')+'</div></div>'+
    '<div class="k-main"><ul class="k-items">'+o.items.map(i=>itemRow(i,ctx)).join('')+'</ul>'+bulk+'</div></article>';
}
function lane(cls, title, icon, list, kind, ctxFor) {
  return '<section class="k-lane '+cls+'"><h2 class="k-lane-head">'+ic(icon)+title+' <span class="k-count">'+list.length+'</span></h2>'+
    (list.length ? list.map(o=>card(o,kind,ctxFor(o))).join('') : '<div class="card k-lane-empty">'+(kind==='recv'?'접수된 주문이 없습니다':'조리 중인 주문이 없습니다')+'</div>')+'</section>';
}
function render() {
  const board = document.getElementById('board'), banner = document.getElementById('banner'), conn = document.getElementById('conn'), tabs = document.getElementById('tabs');
  banner.innerHTML = ''; tabs.innerHTML = '';
  board.dataset.tab = tab;
  conn.className = 'k-conn ok'; conn.setAttribute('role','status'); conn.style.color=''; conn.innerHTML = ic('check')+'연결됨';
  let html = '', nr = ORDERS.recv.length, nc = ORDERS.cook.length;
  if (state==='loading') {
    html = '<div class="k-full loading-note" role="status" aria-busy="true" style="border:0">'+ic('spinner')+'주문을 불러오는 중</div><div class="k-lane"><span class="k-skel"></span><span class="k-skel"></span></div><div class="k-lane"><span class="k-skel"></span></div>';
    conn.className='k-conn'; conn.innerHTML = ic('spinner')+'연결 중'; nr = nc = 0;
  } else if (state==='empty') {
    html = '<div class="k-full k-state">'+ic('utensils')+'<h2>지금 들어온 주문이 없습니다</h2><p>새 주문이 들어오면 이 화면에 바로 나타납니다.</p></div>'; nr = nc = 0;
  } else if (state==='error') {
    html = '<div class="k-full k-state">'+ic('alert')+'<h2>주문을 불러오지 못했습니다</h2><p>네트워크를 확인하고 다시 시도해 주세요.</p><button class="btn btn-primary">'+ic('refresh')+'다시 시도</button></div>';
    conn.className='k-conn'; conn.innerHTML = '<span style="color:var(--color-error);display:inline-flex;align-items:center;gap:4px">'+ic('alert')+'연결 안 됨</span>'; nr = nc = 0;
  } else {
    let ctx = () => ({}), banr = '';
    if (state==='offline') {
      conn.className='k-conn'; conn.innerHTML = '<span style="color:var(--color-warning-text);display:inline-flex;align-items:center;gap:4px">'+ic('alert')+'연결 끊김</span>';
      banr = '<div class="banner banner-warning k-banner" role="alert">'+ic('alert')+'<div class="banner-body"><div class="banner-title" style="font-weight:700">연결이 끊겼습니다. 다시 연결하는 중입니다.</div>아래 주문은 18:41 기준이며 새 주문이 보이지 않을 수 있습니다. 버튼은 연결될 때까지 쓸 수 없습니다.</div><button class="btn btn-secondary">'+ic('refresh')+'다시 연결</button></div>';
    }
    if (state==='busy') ctx = o => o.table===7 ? {busyAll:true, busy:['마른안주','치즈 플레이트','올리브마리네이트']} : (o.table===5 ? {busy:['오늘의 플레이트']} : {});
    if (state==='partial') {
      banr = '<div class="banner banner-error k-banner" role="alert">'+ic('alert')+'<div class="banner-body"><div class="banner-title" style="font-weight:700">7번 테이블: 3개 중 1개를 처리하지 못했습니다</div>마른안주만 다시 시도해 주세요. 나머지 2개는 처리됐습니다.</div></div>';
      ctx = o => o.table===7 ? {fail:'마른안주'} : {};
    }
    banner.innerHTML = banr;
    let recv = ORDERS.recv.map(o=>({...o, items:o.items.map(i=>i.slice())})), cook = ORDERS.cook;
    if (state==='partial') { recv[1].items[1][2]='cooking'; recv[1].items[2][2]='cooking'; }
    html = lane('recv','접수','inbox',recv,'recv',ctx) + lane('cook','조리 중','flame',cook,'cook',ctx);
  }
  board.innerHTML = html;
  if (nr+nc>0 || state==='default') tabs.innerHTML = '<button role="tab" data-tab="recv" aria-selected="'+(tab==='recv')+'">'+ic('inbox')+'접수 <span class="k-count">'+nr+'</span></button><button role="tab" data-tab="cook" aria-selected="'+(tab==='cook')+'">'+ic('flame')+'조리 중 <span class="k-count">'+nc+'</span></button>';
  UI.run();
  if (state==='offline') document.querySelectorAll('.k-card button').forEach(b => b.disabled = true);
  document.querySelectorAll('#bar button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k===state));
}
document.getElementById('bar').innerHTML = '<b>상태 보기</b>' + STATES.map(s=>'<button data-k="'+s[0]+'" aria-pressed="false">'+s[1]+'</button>').join('');
document.getElementById('bar').addEventListener('click', e => { const k = e.target.dataset && e.target.dataset.k; if (k) { state = k; history.replaceState(null,'','?state='+k+'&tab='+tab); render(); } });
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.dataset.tab) { tab = b.dataset.tab; history.replaceState(null,'','?state='+state+'&tab='+tab); render(); } });
render();
</script>
</body>
</html>
