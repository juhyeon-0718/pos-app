<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>식재료 관리 · U-01 프로토타입</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="app-bar"></div>
<div id="proto-bar"></div>
<main class="page" id="main"></main>
<script src="admin.js"></script>
<script>
/* 필드는 openapi.yaml Ingredient / IngredientWrite 그대로: id, name, unit, current_stock, safety_stock, lead_time_days, unit_price, is_active.
   current_stock은 읽기 전용(IngredientWrite에 없음). 값은 모두 더미. */
const { h, icon, won, num, banner, btn, activeBadge, skeletonCells, openModal, closeModal, toast, appBar, stateBar } = Admin;

let ING = [
  { id: 'i_1', name: '돼지고기(앞다리)', unit: 'kg', current_stock: 12.5, safety_stock: 5, lead_time_days: 2, unit_price: 9800, is_active: true },
  { id: 'i_2', name: '양파', unit: 'kg', current_stock: 0.5, safety_stock: 3, lead_time_days: 1, unit_price: 1800, is_active: true },
  { id: 'i_3', name: '대파', unit: '단', current_stock: -2, safety_stock: 2, lead_time_days: 1, unit_price: 2500, is_active: true },
  { id: 'i_4', name: '두부', unit: '모', current_stock: 30, safety_stock: 10, lead_time_days: 1, unit_price: 1500, is_active: true },
  { id: 'i_5', name: '쌀', unit: 'kg', current_stock: 40, safety_stock: 20, lead_time_days: 3, unit_price: 3200, is_active: true },
  { id: 'i_6', name: '고춧가루', unit: 'g', current_stock: 800, lead_time_days: 5, is_active: true },
  { id: 'i_7', name: '계란', unit: '판', current_stock: 3, safety_stock: 2, lead_time_days: 1, unit_price: 6500, is_active: false }
];
const ui = { list: 'default', filter: 'all', hasMore: false, modal: null };
const NAME_MAX = 50; // 제안값(명세 §9 요청)

const visible = () => ING.filter((m) => ui.filter === 'all' || (ui.filter === 'on' ? m.is_active : !m.is_active));
const hasNum = (v) => v !== undefined && v !== null && v !== '';
const isLow = (i) => i.is_active && hasNum(i.safety_stock) && i.current_stock >= 0 && i.current_stock < i.safety_stock;
const isNeg = (i) => i.current_stock < 0;

function card(...kids) { return h('section', { class: 'card' }, kids); }

function render() {
  const main = document.getElementById('main');
  main.replaceChildren();
  const lowCount = ING.filter((i) => isLow(i) || (i.is_active && isNeg(i))).length;
  main.append(h('div', { class: 'page-head' },
    h('div', null, h('h1', { text: '식재료 관리' }), h('p', { class: 'page-sub', text: '레시피에 쓰는 식재료와 최소로 남겨둘 양, 단가를 관리해요.' })),
    btn([icon('plus'), '식재료 추가'], 'primary', () => openForm('create'), (ui.list === 'loading' || ui.list === 'error') ? { disabled: true } : {})));

  if (ui.list === 'loading') return main.append(card(h('div', { 'aria-busy': 'true' },
    h('div', { class: 'loading-note', role: 'status' }, icon('spinner'), '식재료를 불러오는 중이에요…'),
    h('table', null, h('thead', null, headRow()), h('tbody', null, [0, 1, 2, 3, 4].map(() => h('tr', null, skeletonCells(8))))))));
  if (ui.list === 'error') return main.append(card(h('div', { class: 'banner-block' }, banner('error', '식재료 목록을 불러오지 못했어요.', '네트워크 상태를 확인하고 다시 시도해 주세요.',
    btn('다시 시도', 'secondary', () => setList('default'))))));
  if (ui.list === 'empty') return main.append(card(h('div', { class: 'empty' }, icon('info'),
    h('h2', { text: '아직 등록한 식재료가 없어요' }),
    h('p', { text: '식재료를 추가한 뒤 메뉴 레시피에 연결하면, 주문이 들어올 때 재고가 자동으로 줄어요.' }),
    btn([icon('plus'), '식재료 추가'], 'primary', () => openForm('create')))));

  if (lowCount) main.append(h('div', { style: 'margin-bottom:12px' }, banner('warning', `재고 확인이 필요한 식재료가 ${lowCount}개 있어요.`, '"부족" 또는 "재고 음수" 표시를 확인해 주세요.')));
  const count = (f) => ING.filter((m) => f === 'all' || (f === 'on' ? m.is_active : !m.is_active)).length;
  main.append(h('div', { class: 'toolbar' },
    h('div', { class: 'seg', role: 'group', 'aria-label': '사용 상태 필터' },
      ['all:전체', 'on:사용중', 'off:사용중지'].map((s) => { const [k, l] = s.split(':');
        return h('button', { type: 'button', 'aria-pressed': String(ui.filter === k), onclick: () => { ui.filter = k; render(); }, text: `${l} ${count(k)}` }); })),
    h('span', { class: 'result-count', text: `${visible().length}개 표시` })));
  main.append(card(table()));
}

function headRow() {
  return h('tr', null,
    h('th', { scope: 'col', text: '식재료명' }), h('th', { scope: 'col', text: '단위' }),
    h('th', { scope: 'col', class: 'num', text: '현재 재고' }), h('th', { scope: 'col', class: 'num', text: '최소로 남겨둘 양' }),
    h('th', { scope: 'col', class: 'num', text: '도착까지 며칠' }), h('th', { scope: 'col', class: 'num', text: '단가' }),
    h('th', { scope: 'col', text: '상태' }), h('th', { scope: 'col', class: 'cell-actions' }, h('span', { class: 'sr-only', text: '작업' })));
}

function table() {
  const list = visible();
  if (!list.length) return h('div', { class: 'empty' }, icon('info'), h('h2', { text: '조건에 맞는 식재료가 없어요' }), btn('전체 보기', 'secondary', () => { ui.filter = 'all'; render(); }));
  const rows = list.map((i) => {
    const flag = !i.is_active ? null : isNeg(i)
      ? h('span', { class: 'badge badge-negative' }, icon('warn'), '재고 음수')
      : isLow(i) ? h('span', { class: 'badge badge-low' }, icon('warn'), '부족') : null;
    return h('tr', { class: (!i.is_active ? 'row-inactive ' : '') + ((isLow(i) || (i.is_active && isNeg(i))) ? 'row-low' : '') },
      h('td', { class: 'cell-name', title: i.name, text: i.name }),
      h('td', { text: i.unit }),
      h('td', { class: 'num' }, h('div', { class: 'stack' }, h('span', { text: `${num(i.current_stock)} ${i.unit}` }), flag)),
      h('td', { class: 'num' + (hasNum(i.safety_stock) ? '' : ' muted'), text: hasNum(i.safety_stock) ? `${num(i.safety_stock)} ${i.unit}` : '-' }),
      h('td', { class: 'num' + (hasNum(i.lead_time_days) ? '' : ' muted'), text: hasNum(i.lead_time_days) ? `${i.lead_time_days}일` : '-' }),
      h('td', { class: 'num' + (hasNum(i.unit_price) ? '' : ' muted'), text: hasNum(i.unit_price) ? `${won(i.unit_price)}/${i.unit}` : '-' }),
      h('td', null, activeBadge(i.is_active, '사용중', '사용중지')),
      h('td', { class: 'cell-actions' },
        btn('수정', 'text', () => openForm('edit', i), { 'aria-label': `${i.name} 수정` }),
        i.is_active ? btn('삭제', 'text danger', () => openDelete(i), { 'aria-label': `${i.name} 삭제` })
                    : btn('다시 사용', 'text', () => reactivate(i), { 'aria-label': `${i.name} 다시 사용` })));
  });
  const more = ui.hasMore ? h('div', { class: 'recipe-foot' }, h('span', { class: 'muted', text: '50개씩 불러와요. 더 있어요.' }),
    ui.list === 'paging' ? btn([icon('spinner'), '불러오는 중…'], 'secondary', () => {}, { disabled: true }) : btn('더 보기', 'secondary', () => setList('paging'))) : null;
  return h('div', null, h('div', { class: 'table-wrap' }, h('table', null, h('caption', { class: 'sr-only', text: '식재료 목록' }), h('thead', null, headRow()), h('tbody', null, rows))), more);
}

/* ---------- 추가/수정 ---------- */
function openForm(mode, item, preset) {
  const base = item || { name: '', unit: '', safety_stock: '', lead_time_days: '', unit_price: '', is_active: true };
  ui.modal = Object.assign({ kind: 'form', mode, item, status: 'idle', errors: {}, draft: { ...base } }, preset || {});
  drawModal();
}
function validate(d) {
  const e = {};
  if (!String(d.name).trim()) e.name = '식재료 이름을 입력해 주세요.';
  else if (String(d.name).length > NAME_MAX) e.name = `이름은 ${NAME_MAX}자까지 입력할 수 있어요.`;
  if (!String(d.unit).trim()) e.unit = '단위를 입력해 주세요. (예: kg, 개)';
  const nonNeg = (v) => v === '' || v == null || (/^\d+(\.\d+)?$/.test(String(v)));
  if (!nonNeg(d.safety_stock)) e.safety_stock = '0 이상의 숫자로 입력해 주세요.';
  if (!(d.lead_time_days === '' || d.lead_time_days == null || /^\d+$/.test(String(d.lead_time_days)))) e.lead_time_days = '0 이상의 정수(일)로 입력해 주세요.';
  if (!nonNeg(d.unit_price)) e.unit_price = '0 이상의 숫자로 입력해 주세요.';
  return e;
}
const fe = (id, t) => t ? h('div', { class: 'field-error', id }, icon('warn'), h('span', { text: t })) : null;

function numField(m, key, label, suffix, help, step) {
  const busy = m.status === 'saving', d = m.draft, id = 'f-' + key;
  return h('div', { class: 'field' },
    h('label', { for: id, text: label }),
    h('div', { class: 'input-wrap' },
      h('input', { id, class: 'input', type: 'number', inputmode: step === '1' ? 'numeric' : 'decimal', min: '0', step, value: d[key] ?? '', disabled: busy,
        'aria-invalid': m.errors[key] ? 'true' : null, 'aria-describedby': (m.errors[key] ? 'e-' + key + ' ' : '') + 'h-' + key, oninput: (e) => { d[key] = e.target.value; } }),
      h('span', { class: 'suffix', text: suffix })),
    h('div', { class: 'help', id: 'h-' + key, text: help }), fe('e-' + key, m.errors[key]));
}

function formBody(m) {
  const d = m.draft, busy = m.status === 'saving';
  const body = [];
  if (m.status === 'e409') body.push(banner('error', '같은 이름의 식재료가 이미 있어요.', '다른 이름으로 바꿔서 저장해 주세요.'));
  if (m.status === 'e422') body.push(banner('error', '입력한 내용을 저장하지 못했어요.', '이름, 단위와 숫자 항목을 다시 확인해 주세요.'));
  body.push(h('div', { class: 'field' },
    h('label', { for: 'f-name' }, '식재료 이름', h('span', { class: 'req', 'aria-hidden': 'true', text: '*' })),
    h('input', { id: 'f-name', class: 'input', type: 'text', value: d.name, required: true, maxlength: NAME_MAX + 10, placeholder: '예: 돼지고기(앞다리)', autocomplete: 'off', disabled: busy,
      'aria-invalid': (m.errors.name || m.status === 'e409') ? 'true' : null, 'aria-describedby': m.errors.name ? 'e-name' : null, 'data-autofocus': true, oninput: (e) => { d.name = e.target.value; } }),
    fe('e-name', m.errors.name)));
  body.push(h('div', { class: 'field' },
    h('label', { for: 'f-unit' }, '단위', h('span', { class: 'req', 'aria-hidden': 'true', text: '*' })),
    h('input', { id: 'f-unit', class: 'input', type: 'text', list: 'unit-list', value: d.unit, required: true, placeholder: '예: kg, g, 개', autocomplete: 'off', disabled: busy,
      'aria-invalid': m.errors.unit ? 'true' : null, 'aria-describedby': (m.errors.unit ? 'e-unit ' : '') + 'h-unit', oninput: (e) => { d.unit = e.target.value; } }),
    h('datalist', { id: 'unit-list' }, ['kg', 'g', 'L', 'mL', '개', '모', '단', '판', '봉', '병'].map((u) => h('option', { value: u }))),
    h('div', { class: 'help', id: 'h-unit', text: '레시피 수량도 이 단위로 입력해요.' }), fe('e-unit', m.errors.unit)));
  if (m.mode === 'edit') body.push(h('div', { class: 'readonly-row' },
    h('span', null, h('span', { class: 'muted', text: '현재 재고 ' }), h('strong', { text: `${num(m.item.current_stock)} ${m.item.unit}` })),
    h('span', { class: 'help', text: '재고 수량은 이 화면에서 바꿀 수 없어요.' })));
  body.push(numField(m, 'safety_stock', '최소로 남겨둘 양', d.unit || '단위', '이 수량보다 적어지면 "부족"으로 표시해요.', 'any'));
  body.push(numField(m, 'lead_time_days', '주문 후 도착까지 며칠', '일', '주문하고 받기까지 걸리는 일수예요.', '1'));
  body.push(numField(m, 'unit_price', '단가', '원', '단위 1개당 가격이에요. 발주 비용 계산에 써요.', 'any'));
  body.push(h('label', { class: 'check' },
    h('input', { type: 'checkbox', checked: d.is_active, disabled: busy, onchange: (e) => { d.is_active = e.target.checked; } }),
    h('span', null, '사용 중 ', h('span', { class: 'muted', text: '(레시피에 넣을 수 있음)' }))));
  return body;
}

function drawModal() {
  const m = ui.modal;
  if (!m) return closeModal();
  if (m.kind === 'form') {
    const busy = m.status === 'saving';
    openModal({ title: m.mode === 'create' ? '식재료 추가' : '식재료 수정', busy, onClose: cancelModal, body: formBody(m),
      footer: [btn('취소', 'secondary', cancelModal, busy ? { disabled: true } : {}),
        busy ? btn([icon('spinner'), '저장 중…'], 'primary', () => {}, { disabled: true }) : btn('저장', 'primary', submitForm)] });
    const bad = document.querySelector('#overlay [aria-invalid="true"]');
    if (bad) bad.focus();
    return;
  }
  const busy = m.status === 'deleting', name = m.item.name, body = [];
  if (m.status === 'e409') {
    body.push(banner('error', `"${name}"은(는) 레시피에서 사용 중이라 삭제할 수 없어요.`, '해당 메뉴의 레시피에서 먼저 이 식재료를 빼 주세요.'));
  } else {
    if (m.status === 'failed') body.push(banner('error', '삭제하지 못했어요.', '잠시 후 다시 시도해 주세요.'));
    body.push(h('p', null, h('span', { class: 'name-quote', text: `"${name}"` }), ' 식재료를 삭제할까요?'));
    body.push(h('p', { class: 'muted', text: '삭제하면 "사용중지"로 바뀌고 레시피 선택 목록과 발주 추천에서 빠져요. 재고 기록과 지난 분석 데이터는 그대로 남아요.' }));
  }
  const footer = m.status === 'e409'
    ? [btn('닫기', 'secondary', cancelModal, { 'data-autofocus': true })]
    : [btn('취소', 'secondary', cancelModal, Object.assign({ 'data-autofocus': true }, busy ? { disabled: true } : {})),
       busy ? btn([icon('spinner'), '삭제 중…'], 'danger', () => {}, { disabled: true }) : btn(m.status === 'failed' ? '다시 시도' : '삭제', 'danger', confirmDelete)];
  openModal({ title: '식재료 삭제', alert: true, busy, onClose: cancelModal, body, footer });
}
function cancelModal() { ui.modal = null; closeModal(); }

function submitForm() {
  const m = ui.modal; m.errors = validate(m.draft);
  if (Object.keys(m.errors).length) { m.status = 'idle'; return drawModal(); }
  m.status = 'saving'; drawModal();
  setTimeout(() => {
    const d = m.draft;
    if (ING.some((x) => x.name === d.name.trim() && (!m.item || x.id !== m.item.id))) { m.status = 'e409'; return drawModal(); }
    const opt = (v) => (v === '' || v == null ? undefined : Number(v));   // 비우면 필드를 보내지 않는다
    const rec = { id: m.item ? m.item.id : 'i_' + (ING.length + 1), name: d.name.trim(), unit: d.unit.trim(), current_stock: m.item ? m.item.current_stock : 0,
      safety_stock: opt(d.safety_stock), lead_time_days: opt(d.lead_time_days), unit_price: opt(d.unit_price), is_active: !!d.is_active };
    ING = m.item ? ING.map((x) => (x.id === rec.id ? rec : x)) : [...ING, rec];
    ui.modal = null; closeModal(); render(); toast(`"${rec.name}" 식재료를 저장했어요.`);
  }, 700);
}
function openDelete(item) { ui.modal = { kind: 'delete', item, status: 'idle' }; drawModal(); }
function confirmDelete() {
  const m = ui.modal; m.status = 'deleting'; drawModal();
  setTimeout(() => {
    if (m.item.id === 'i_2') { m.status = 'e409'; return drawModal(); }   // 시연: 양파는 레시피에서 사용 중 → 409
    ING = ING.map((x) => (x.id === m.item.id ? { ...x, is_active: false } : x));
    ui.modal = null; closeModal(); render(); toast(`"${m.item.name}" 식재료를 삭제했어요. (사용중지로 바뀌었어요)`);
  }, 600);
}
function reactivate(i) { ING = ING.map((x) => (x.id === i.id ? { ...x, is_active: true } : x)); render(); toast(`"${i.name}" 식재료를 다시 사용해요.`); }

/* ---------- 프로토타입 상태 전환 ---------- */
function setList(key) {
  ui.list = key === 'paged' ? 'default' : key; ui.hasMore = key === 'paged' || key === 'paging';
  if (key === 'paging') setTimeout(() => { if (ui.list === 'paging') { ui.list = 'default'; ui.hasMore = false; render(); } }, 900);
  render();
}
function pick(key) {
  if (['default', 'paged', 'paging', 'loading', 'empty', 'error'].includes(key)) { cancelModal(); setList(key); return syncBar(key); }
  ui.list = 'default'; render();
  const item = ING[0], bad = { name: '', unit: '', safety_stock: '-1', lead_time_days: '1.5', unit_price: '', is_active: true };
  if (key === 'm-create') openForm('create');
  if (key === 'm-edit') openForm('edit', item);
  if (key === 'm-invalid') openForm('create', null, { draft: bad, errors: validate(bad) });
  if (key === 'm-saving') openForm('edit', item, { status: 'saving' });
  if (key === 'm-409') openForm('edit', item, { status: 'e409' });
  if (key === 'm-422') openForm('edit', item, { status: 'e422' });
  if (key === 'm-del') openDelete(item);
  if (key === 'm-delbusy') { openDelete(item); ui.modal.status = 'deleting'; drawModal(); }
  if (key === 'm-del409') { openDelete(ING[1]); ui.modal.status = 'e409'; drawModal(); }
  if (key === 'm-delfail') { openDelete(item); ui.modal.status = 'failed'; drawModal(); }
  syncBar(key);
}
function syncBar(cur) {
  const mk = (arr) => arr.map(([key, label]) => ({ key, label }));
  document.getElementById('proto-bar').replaceChildren(stateBar([
    { label: '목록', items: mk([['default', '기본(부족·음수·중지 포함)'], ['paged', '더 보기 있음'], ['paging', '더 불러오는 중'], ['loading', '로딩'], ['empty', '빈 상태'], ['error', '오류']]) },
    { label: '입력창', items: mk([['m-create', '추가'], ['m-edit', '수정'], ['m-invalid', '입력 오류'], ['m-saving', '저장 중'], ['m-409', '409 중복'], ['m-422', '422 검증']]) },
    { label: '삭제', items: mk([['m-del', '확인'], ['m-delbusy', '삭제 중'], ['m-del409', '409 레시피 사용 중'], ['m-delfail', '삭제 실패']]) }
  ], cur, pick));
}

document.getElementById('app-bar').append(appBar('ingredients'));
const initial = Admin.stateFromHash('default');
render(); pick(initial);
</script>
</body>
</html>
