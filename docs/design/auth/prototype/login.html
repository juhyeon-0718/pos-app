<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · U-03 시안 (메인 화면)</title>
<link rel="stylesheet" href="../../components/prototype/components.css">
<style>
  .a-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--spacing-xl); }
  .a-card { width: 100%; max-width: 420px; padding: var(--spacing-2xl); display: flex; flex-direction: column; gap: var(--gap-xl); box-shadow: var(--shadow-md); }
  .a-logo { display: block; width: 260px; max-width: 100%; height: auto; margin: 0 auto; }
  .a-card h1 { font-size: var(--font-size-3xl); text-align: center; }
  .a-card .sub { text-align: center; color: var(--color-text-secondary); margin-top: var(--spacing-xs); }
  .a-form .field { margin-bottom: var(--spacing-lg); }
  .a-form .input { min-height: var(--size-touch-lg); }
  .a-foot { text-align: center; color: var(--color-text-secondary); font-size: var(--font-size-sm); }
</style>
</head>
<body>
<main class="a-wrap">
  <section class="card a-card" aria-labelledby="a-t">
    <img class="a-logo" src="../../brand/logo-black.png" alt="75MHz LIVE PUB">
    <div><h1 id="a-t">로그인</h1><p class="sub">직원 · 주방 · 사장 계정으로 들어옵니다</p></div>
    <form class="a-form" onsubmit="return false">
      <div class="field"><label for="u">아이디</label><input class="input" id="u" autocomplete="username" required></div>
      <div class="field"><label for="p">비밀번호</label><input class="input" id="p" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-lg btn-block" type="submit">로그인</button>
    </form>
    <p class="a-foot">손님은 테이블의 QR 코드로 주문합니다.</p>
  </section>
</main>
<script src="../../components/prototype/ui.js"></script>
</body>
</html>
